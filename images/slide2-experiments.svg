<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none">
  <!-- Background -->
  <rect width="480" height="280" rx="12" fill="#f0f7f7"/>
  
  <!-- Title -->
  <text x="240" y="30" text-anchor="middle" font-size="12" fill="#2D3748" font-weight="700" font-family="system-ui" letter-spacing="0.5">MÜLLER-LYER ILLUSION</text>
  
  <!-- Left illusion: arrows pointing outward (appears longer) -->
  <g transform="translate(120,100)">
    <text x="0" y="-20" text-anchor="middle" font-size="9" fill="#718096" font-family="system-ui">Appears longer</text>
    <!-- Main line -->
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#2B6CB0" stroke-width="3" stroke-linecap="round"/>
    <!-- Left arrow pointing outward (away from line) -->
    <line x1="-60" y1="0" x2="-78" y2="-14" stroke="#2B6CB0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-60" y1="0" x2="-78" y2="14" stroke="#2B6CB0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right arrow pointing outward -->
    <line x1="60" y1="0" x2="78" y2="-14" stroke="#2B6CB0" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="0" x2="78" y2="14" stroke="#2B6CB0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Length label -->
    <line x1="-60" y1="24" x2="60" y2="24" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="0" y="38" text-anchor="middle" font-size="8" fill="#A0AEC0" font-family="system-ui">← same length →</text>
  </g>
  
  <!-- Right illusion: arrows pointing inward (appears shorter) -->
  <g transform="translate(360,100)">
    <text x="0" y="-20" text-anchor="middle" font-size="9" fill="#718096" font-family="system-ui">Appears shorter</text>
    <!-- Main line -->
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#E53E3E" stroke-width="3" stroke-linecap="round"/>
    <!-- Left arrow pointing inward (toward line) -->
    <line x1="-60" y1="0" x2="-42" y2="-14" stroke="#E53E3E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-60" y1="0" x2="-42" y2="14" stroke="#E53E3E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right arrow pointing inward -->
    <line x1="60" y1="0" x2="42" y2="-14" stroke="#E53E3E" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="60" y1="0" x2="42" y2="14" stroke="#E53E3E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Length label -->
    <line x1="-60" y1="24" x2="60" y2="24" stroke="#A0AEC0" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="0" y="38" text-anchor="middle" font-size="8" fill="#A0AEC0" font-family="system-ui">← same length →</text>
  </g>
  
  <!-- Equal sign between them -->
  <text x="240" y="105" text-anchor="middle" font-size="22" fill="#2D3748" font-weight="700" font-family="system-ui">=</text>
  
  <!-- Bottom section: Duck-Rabbit illusion -->
  <g transform="translate(240,210)">
    <rect x="-180" y="-45" width="360" height="90" rx="10" fill="#fff" stroke="#E2E8F0" stroke-width="1"/>
    <text x="0" y="-28" text-anchor="middle" font-size="10" fill="#2D3748" font-weight="700" font-family="system-ui">DUCK-RABBIT ILLUSION</text>
    
    <!-- Simplified duck-rabbit head -->
    <g transform="translate(-80,5)">
      <!-- Head shape -->
      <ellipse cx="0" cy="0" rx="30" ry="22" fill="#EDF2F7" stroke="#2D3748" stroke-width="1.5"/>
      <!-- Beak/rabbit nose - ambiguous -->
      <path d="M28,-4 L48,-2 L28,4" stroke="#2D3748" stroke-width="1.5" fill="#EDF2F7"/>
      <!-- Eye -->
      <circle cx="-8" cy="-6" r="3" fill="#2D3748"/>
      <!-- Ear/rabbit ears or duck head top -->
      <path d="M-10,-20 C-6,-32 6,-32 10,-20" stroke="#2D3748" stroke-width="1.5" fill="none"/>
    </g>
    
    <text x="20" y="-8" font-size="9" fill="#718096" font-family="system-ui" font-style="italic">Duck or Rabbit?</text>
    <text x="20" y="8" font-size="8" fill="#A0AEC0" font-family="system-ui">Perception varies by individual</text>
    
    <!-- Divider -->
    <line x1="100" y1="-30" x2="100" y2="30" stroke="#E2E8F0" stroke-width="1"/>
    
    <!-- Right side: eye icon -->
    <g transform="translate(140,0)">
      <circle cx="0" cy="0" r="18" fill="#EBF8FF" stroke="#2B6CB0" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7" fill="#2B6CB0"/>
      <circle cx="2" cy="-2" r="2.5" fill="#fff"/>
      <text x="0" y="30" text-anchor="middle" font-size="8" fill="#2B6CB0" font-weight="600" font-family="system-ui">Perception</text>
    </g>
    
    <text x="20" y="28" font-size="8" fill="#A0AEC0" font-family="system-ui">Same image, different interpretation</text>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="30" cy="30" r="2" fill="#4FD1C5" opacity="0.3"/>
  <circle cx="450" cy="250" r="2" fill="#4FD1C5" opacity="0.3"/>
</svg>