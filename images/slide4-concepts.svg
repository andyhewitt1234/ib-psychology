<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 280" fill="none">
  <!-- Background -->
  <rect width="480" height="280" rx="12" fill="#f0f7f7"/>
  
  <!-- Title -->
  <text x="240" y="26" text-anchor="middle" font-size="11" fill="#2D3748" font-weight="700" font-family="system-ui" letter-spacing="0.5">6 CORE CONCEPTS</text>
  
  <!-- Center hub -->
  <circle cx="240" cy="145" r="38" fill="#2B6CB0" opacity="0.9"/>
  <text x="240" y="141" text-anchor="middle" font-size="10" fill="#fff" font-weight="700" font-family="system-ui">IB</text>
  <text x="240" y="153" text-anchor="middle" font-size="9" fill="#fff" font-weight="600" font-family="system-ui">Psychology</text>
  
  <!-- Concept 1: Bias (top-left) -->
  <g transform="translate(110,60)">
    <line x1="65" y1="35" x2="120" y2="75" stroke="#805AD5" stroke-width="2" opacity="0.5"/>
    <rect x="-45" y="-20" width="90" height="40" rx="8" fill="#805AD5" opacity="0.9"/>
    <text x="0" y="-3" text-anchor="middle" font-size="9" fill="#fff" font-weight="700" font-family="system-ui">Bias</text>
    <text x="0" y="10" text-anchor="middle" font-size="7" fill="#E9D8FD" font-family="system-ui">Expectations</text>
    <!-- Eye with filter icon -->
    <circle cx="35" cy="-12" r="8" fill="#fff" opacity="0.2"/>
    <text x="35" y="-8" text-anchor="middle" font-size="9">🎯</text>
  </g>
  
  <!-- Concept 2: Causality (top-right) -->
  <g transform="translate(370,60)">
    <line x1="-65" y1="35" x2="-120" y2="75" stroke="#E53E3E" stroke-width="2" opacity="0.5"/>
    <rect x="-45" y="-20" width="90" height="40" rx="8" fill="#E53E3E" opacity="0.85"/>
    <text x="0" y="-3" text-anchor="middle" font-size="9" fill="#fff" font-weight="700" font-family="system-ui">Causality</text>
    <text x="0" y="10" text-anchor="middle" font-size="7" fill="#FED7D7" font-family="system-ui">Cause & Effect</text>
    <circle cx="-35" cy="-12" r="8" fill="#fff" opacity="0.2"/>
    <text x="-35" y="-8" text-anchor="middle" font-size="9">⚡</text>
  </g>
  
  <!-- Concept 3: Change (right) -->
  <g transform="translate(410,155)">
    <line x1="-50" y1="0" x2="-115" y2="0" stroke="#38A169" stroke-width="2" opacity="0.5"/>
    <rect x="-45" y="-20" width="90" height="40" rx="8" fill="#38A169" opacity="0.85"/>
    <text x="0" y="-3" text-anchor="middle" font-size="9" fill="#fff" font-weight="700" font-family="system-ui">Change</text>
    <text x="0" y="10" text-anchor="middle" font-size="7" fill="#C6F6D5" font-family="system-ui">Evolution</text>
    <circle cx="-35" cy="-12" r="8" fill="#fff" opacity="0.2"/>
    <text x="-35" y="-8" text-anchor="middle" font-size="9">🔄</text>
  </g>
  
  <!-- Concept 4: Measurement (bottom-right) -->
  <g transform="translate(370,240)">
    <line x1="-65" y1="-30" x2="-120" y2="-80" stroke="#DD6B20" stroke-width="2" opacity="0.5"/>
    <rect x="-45" y="-20" width="90" height="40" rx="8" fill="#DD6B20" opacity="0.85"/>
    <text x="0" y="-3" text-anchor="middle" font-size="9" fill="#fff" font-weight="700" font-family="system-ui">Measurement</text>
    <text x="0" y="10" text-anchor="middle" font-size="7" fill="#FEEBC8" font-family="system-ui">Quantify</text>
    <circle cx="35" cy="12" r="8" fill="#fff" opacity="0.2"/>
    <text x="35" y="16" text-anchor="middle" font-size="9">📏</text>
  </g>
  
  <!-- Concept 5: Perspective (bottom-left) -->
  <g transform="translate(110,240)">
    <line x1="65" y1="-30" x2="120" y2="-80" stroke="#D69E2E" stroke-width="2" opacity="0.5"/>
    <rect x="-45" y="-20" width="90" height="40" rx="8" fill="#D69E2E" opacity="0.85"/>
    <text x="0" y="-3" text-anchor="middle" font-size="9" fill="#fff" font-weight="700" font-family="system-ui">Perspective</text>
    <text x="0" y="10" text-anchor="middle" font-size="7" fill="#FEFCBF" font-family="system-ui">Lenses</text>
    <circle cx="35" cy="12" r="8" fill="#fff" opacity="0.2"/>
    <text x="35" y="16" text-anchor="middle" font-size="9">👁</text>
  </g>
  
  <!-- Concept 6: Responsibility (left) -->
  <g transform="translate(70,155)">
    <line x1="50" y1="0" x2="115" y2="0" stroke="#3182CE" stroke-width="2" opacity="0.5"/>
    <rect x="-45" y="-20" width="90" height="40" rx="8" fill="#3182CE" opacity="0.85"/>
    <text x="0" y="-3" text-anchor="middle" font-size="9" fill="#fff" font-weight="700" font-family="system-ui">Responsibility</text>
    <text x="0" y="10" text-anchor="middle" font-size="7" fill="#BEE3F8" font-family="system-ui">Ethics</text>
    <circle cx="35" cy="-12" r="8" fill="#fff" opacity="0.2"/>
    <text x="35" y="-8" text-anchor="middle" font-size="9">⚖️</text>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="25" cy="25" r="2" fill="#4FD1C5" opacity="0.3"/>
  <circle cx="455" cy="260" r="2" fill="#4FD1C5" opacity="0.3"/>
</svg>