<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" fill="none">
  <!-- Background -->
  <rect width="480" height="320" rx="12" fill="#f0f7f7"/>
  
  <!-- Brain silhouette -->
  <g transform="translate(240,150)">
    <!-- Brain outline - left hemisphere -->
    <path d="M-8,-72 C-32,-72 -52,-60 -58,-40 C-64,-20 -62,-4 -56,8 C-62,18 -68,32 -64,48 C-60,64 -44,72 -28,72 C-20,72 -14,68 -8,60" 
          stroke="#2B6CB0" stroke-width="2.5" fill="#dbeafe" stroke-linecap="round"/>
    <!-- Brain outline - right hemisphere -->
    <path d="M8,-72 C32,-72 52,-60 58,-40 C64,-20 62,-4 56,8 C62,18 68,32 64,48 C60,64 44,72 28,72 C20,72 14,68 8,60" 
          stroke="#2B6CB0" stroke-width="2.5" fill="#dbeafe" stroke-linecap="round"/>
    <!-- Brain center line -->
    <line x1="0" y1="-72" x2="0" y2="60" stroke="#2B6CB0" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
    <!-- Brain folds - left -->
    <path d="M-48,-30 C-36,-22 -20,-26 -12,-18" stroke="#2B6CB0" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M-52,0 C-40,8 -24,4 -10,10" stroke="#2B6CB0" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M-44,28 C-32,34 -18,30 -8,38" stroke="#2B6CB0" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Brain folds - right -->
    <path d="M48,-30 C36,-22 20,-26 12,-18" stroke="#2B6CB0" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M52,0 C40,8 24,4 10,10" stroke="#2B6CB0" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M44,28 C32,34 18,30 8,38" stroke="#2B6CB0" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    
    <!-- Neural connection lines radiating outward -->
    <line x1="-56" y1="-30" x2="-120" y2="-65" stroke="#4FD1C5" stroke-width="1.5" opacity="0.6"/>
    <line x1="-58" y1="10" x2="-128" y2="18" stroke="#4FD1C5" stroke-width="1.5" opacity="0.6"/>
    <line x1="-40" y1="50" x2="-110" y2="82" stroke="#4FD1C5" stroke-width="1.5" opacity="0.6"/>
    <line x1="56" y1="-30" x2="120" y2="-65" stroke="#4FD1C5" stroke-width="1.5" opacity="0.6"/>
    <line x1="58" y1="10" x2="128" y2="18" stroke="#4FD1C5" stroke-width="1.5" opacity="0.6"/>
    <line x1="40" y1="50" x2="110" y2="82" stroke="#4FD1C5" stroke-width="1.5" opacity="0.6"/>
    <line x1="0" y1="-72" x2="0" y2="-100" stroke="#4FD1C5" stroke-width="1.5" opacity="0.6"/>
    <line x1="-20" y1="70" x2="-28" y2="100" stroke="#4FD1C5" stroke-width="1.5" opacity="0.6"/>
    <line x1="20" y1="70" x2="28" y2="100" stroke="#4FD1C5" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Node circles at ends of connections -->
    <!-- Top -->
    <circle cx="0" cy="-103" r="20" fill="#4FD1C5" opacity="0.9"/>
    <text x="0" y="-99" text-anchor="middle" font-size="12" fill="#fff" font-weight="600" font-family="system-ui">Mind</text>
    
    <!-- Top-left -->
    <circle cx="-122" cy="-67" r="24" fill="#2B6CB0" opacity="0.85"/>
    <text x="-122" y="-63" text-anchor="middle" font-size="11" fill="#fff" font-weight="600" font-family="system-ui">Biological</text>
    
    <!-- Mid-left -->
    <circle cx="-130" cy="18" r="22" fill="#E53E3E" opacity="0.8"/>
    <text x="-130" y="22" text-anchor="middle" font-size="11" fill="#fff" font-weight="600" font-family="system-ui">Emotion</text>
    
    <!-- Bottom-left -->
    <circle cx="-112" cy="84" r="21" fill="#D69E2E" opacity="0.85"/>
    <text x="-112" y="88" text-anchor="middle" font-size="11" fill="#fff" font-weight="600" font-family="system-ui">Social</text>
    
    <!-- Top-right -->
    <circle cx="122" cy="-67" r="24" fill="#805AD5" opacity="0.85"/>
    <text x="122" y="-63" text-anchor="middle" font-size="11" fill="#fff" font-weight="600" font-family="system-ui">Cognitive</text>
    
    <!-- Mid-right -->
    <circle cx="130" cy="18" r="22" fill="#38A169" opacity="0.8"/>
    <text x="130" y="22" text-anchor="middle" font-size="11" fill="#fff" font-weight="600" font-family="system-ui">Behaviour</text>
    
    <!-- Bottom-right -->
    <circle cx="112" cy="84" r="21" fill="#DD6B20" opacity="0.85"/>
    <text x="112" y="88" text-anchor="middle" font-size="11" fill="#fff" font-weight="600" font-family="system-ui">Science</text>
    
    <!-- Bottom-left -->
    <circle cx="-30" cy="103" r="18" fill="#C53030" opacity="0.8"/>
    <text x="-30" y="107" text-anchor="middle" font-size="11" fill="#fff" font-weight="600" font-family="system-ui">Culture</text>
    
    <!-- Bottom-right -->
    <circle cx="30" cy="103" r="18" fill="#3182CE" opacity="0.8"/>
    <text x="30" y="107" text-anchor="middle" font-size="11" fill="#fff" font-weight="600" font-family="system-ui">Groups</text>
  </g>
  
  <!-- Small decorative neurons -->
  <circle cx="40" cy="40" r="2" fill="#4FD1C5" opacity="0.4"/>
  <circle cx="440" cy="50" r="2.5" fill="#4FD1C5" opacity="0.3"/>
  <circle cx="50" cy="280" r="2" fill="#2B6CB0" opacity="0.3"/>
  <circle cx="430" cy="270" r="2" fill="#2B6CB0" opacity="0.35"/>
</svg>
