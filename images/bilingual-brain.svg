<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="400" height="280">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="280" fill="url(#bg2)" rx="8"/>
  
  <!-- Brain outline (simplified side view) -->
  <g transform="translate(200, 120)">
    <!-- Brain shape -->
    <path d="M-80,-60 C-90,-50 -95,-20 -90,10 C-85,40 -70,60 -50,70 C-30,80 -10,85 10,80 C30,75 50,65 65,50 C80,35 85,10 80,-15 C75,-40 60,-55 40,-65 C20,-75 0,-78 -20,-75 C-40,-72 -60,-68 -80,-60 Z" 
          fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
    
    <!-- Brain folds (sulci) -->
    <path d="M-60,-40 C-40,-35 -20,-45 0,-40" stroke="#f87171" stroke-width="1.5" fill="none"/>
    <path d="M-70,-10 C-50,-5 -30,-15 -10,-10" stroke="#f87171" stroke-width="1.5" fill="none"/>
    <path d="M-60,20 C-40,25 -20,15 0,20" stroke="#f87171" stroke-width="1.5" fill="none"/>
    <path d="M-40,50 C-20,45 0,55 20,50" stroke="#f87171" stroke-width="1.5" fill="none"/>
    
    <!-- Language areas highlighted -->
    <!-- Left hemisphere - Language production (Broca's area) -->
    <ellipse cx="-55" cy="-15" rx="20" ry="15" fill="#3b82f6" opacity="0.6"/>
    <text x="-55" y="-12" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#1e40af">Broca's</text>
    <text x="-55" y="-4" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#1e40af">Area</text>
    
    <!-- Left hemisphere - Language comprehension (Wernicke's area) -->
    <ellipse cx="30" cy="20" rx="22" ry="15" fill="#8b5cf6" opacity="0.6"/>
    <text x="30" y="23" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="600" fill="#5b21b6">Wernicke's</text>
    <text x="30" y="32" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#5b21b6">Area</text>
    
    <!-- Connection between areas -->
    <path d="M-35,-10 C-10,0 10,10 10,20" stroke="#6366f1" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arrow3)"/>
    <text x="-12" y="0" font-family="Inter, sans-serif" font-size="7" fill="#4f46e5" transform="rotate(-15, -12, 0)">arcuate</text>
    
    <!-- Executive control (prefrontal) -->
    <ellipse cx="-75" cy="-45" rx="18" ry="12" fill="#10b981" opacity="0.6"/>
    <text x="-75" y="-42" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" font-weight="600" fill="#065f46">Executive</text>
    <text x="-75" y="-34" text-anchor="middle" font-family="Inter, sans-serif" font-size="7" fill="#065f46">Control</text>
  </g>
  
  <!-- Language labels -->
  <g transform="translate(60, 100)">
    <rect x="-40" y="-12" width="80" height="24" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#1e40af">Language 1</text>
  </g>
  
  <g transform="translate(340, 100)">
    <rect x="-40" y="-12" width="80" height="24" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1"/>
    <text x="0" y="4" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#5b21b6">Language 2</text>
  </g>
  
  <!-- Arrows from languages to brain -->
  <line x1="100" y1="100" x2="140" y2="105" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow3)"/>
  <line x1="300" y1="100" x2="260" y2="105" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrow4)"/>
  
  <!-- Benefits box -->
  <g transform="translate(200, 230)">
    <rect x="-160" y="-20" width="320" height="40" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
    <text x="0" y="-5" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#065f46">Cognitive Benefits of Bilingualism</text>
    <text x="0" y="10" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#047857">↑ Executive function  •  ↑ Attention control  •  ↑ Cognitive reserve</text>
  </g>
  
  <!-- Title -->
  <text x="200" y="25" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1e293b">The Bilingual Brain</text>
  <text x="200" y="42" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#64748b">Enhanced neural networks from managing two languages</text>
  
  <defs>
    <marker id="arrow3" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5" fill="#6366f1"/>
    </marker>
    <marker id="arrow4" markerWidth="6" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <path d="M0,0 L6,2.5 L0,5" fill="#8b5cf6"/>
    </marker>
  </defs>
</svg>