<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" fill="none">
  <!-- Background -->
  <rect width="480" height="300" rx="12" fill="#f0f7f7"/>
  
  <!-- Title -->
  <text x="240" y="30" text-anchor="middle" font-size="14" fill="#2D3748" font-weight="700" font-family="system-ui" letter-spacing="0.5">4 CONTEXTS</text>
  
  <!-- Overlapping circles (Venn-style) -->
  <!-- Circle 1: Health & Well-being (top-left) -->
  <circle cx="180" cy="130" r="75" fill="#4FD1C5" opacity="0.2" stroke="#4FD1C5" stroke-width="2"/>
  <text x="148" y="108" text-anchor="middle" font-size="12" fill="#234E52" font-weight="700" font-family="system-ui">Health &amp;</text>
  <text x="148" y="123" text-anchor="middle" font-size="12" fill="#234E52" font-weight="700" font-family="system-ui">Well-being</text>
  <text x="148" y="148" text-anchor="middle" font-size="22">💚</text>
  
  <!-- Circle 2: Human Development (top-right) -->
  <circle cx="300" cy="130" r="75" fill="#805AD5" opacity="0.2" stroke="#805AD5" stroke-width="2"/>
  <text x="332" y="108" text-anchor="middle" font-size="12" fill="#44337A" font-weight="700" font-family="system-ui">Human</text>
  <text x="332" y="123" text-anchor="middle" font-size="12" fill="#44337A" font-weight="700" font-family="system-ui">Development</text>
  <text x="332" y="148" text-anchor="middle" font-size="22">🌱</text>
  
  <!-- Circle 3: Human Relationships (bottom-left) -->
  <circle cx="180" cy="215" r="75" fill="#E53E3E" opacity="0.18" stroke="#E53E3E" stroke-width="2"/>
  <text x="148" y="205" text-anchor="middle" font-size="12" fill="#742A2A" font-weight="700" font-family="system-ui">Human</text>
  <text x="148" y="220" text-anchor="middle" font-size="12" fill="#742A2A" font-weight="700" font-family="system-ui">Relationships</text>
  <text x="148" y="245" text-anchor="middle" font-size="22">🤝</text>
  
  <!-- Circle 4: Learning & Cognition (bottom-right) -->
  <circle cx="300" cy="215" r="75" fill="#D69E2E" opacity="0.18" stroke="#D69E2E" stroke-width="2"/>
  <text x="332" y="205" text-anchor="middle" font-size="12" fill="#744210" font-weight="700" font-family="system-ui">Learning &amp;</text>
  <text x="332" y="220" text-anchor="middle" font-size="12" fill="#744210" font-weight="700" font-family="system-ui">Cognition</text>
  <text x="332" y="245" text-anchor="middle" font-size="22">📚</text>
  
  <!-- Center overlap highlight -->
  <circle cx="240" cy="172" r="28" fill="#fff" opacity="0.5" stroke="#2D3748" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="240" y="168" text-anchor="middle" font-size="11" fill="#2D3748" font-weight="700" font-family="system-ui">Applied</text>
  <text x="240" y="181" text-anchor="middle" font-size="11" fill="#2D3748" font-weight="700" font-family="system-ui">Psychology</text>
  
  <!-- Side annotations -->
  <g transform="translate(52,130)">
    <rect x="-40" y="-16" width="80" height="32" rx="6" fill="#EBF8FF" stroke="#2B6CB0" stroke-width="1"/>
    <text x="0" y="-2" text-anchor="middle" font-size="10" fill="#2B6CB0" font-weight="600" font-family="system-ui">Real-world</text>
    <text x="0" y="10" text-anchor="middle" font-size="10" fill="#2B6CB0" font-weight="600" font-family="system-ui">contexts</text>
    <line x1="40" y1="0" x2="78" y2="0" stroke="#2B6CB0" stroke-width="1" stroke-dasharray="3,2"/>
  </g>
  
  <g transform="translate(428,172)">
    <rect x="-40" y="-16" width="80" height="32" rx="6" fill="#EBF8FF" stroke="#2B6CB0" stroke-width="1"/>
    <text x="0" y="-2" text-anchor="middle" font-size="10" fill="#2B6CB0" font-weight="600" font-family="system-ui">Concepts</text>
    <text x="0" y="10" text-anchor="middle" font-size="10" fill="#2B6CB0" font-weight="600" font-family="system-ui">applied</text>
    <line x1="-40" y1="0" x2="-78" y2="0" stroke="#2B6CB0" stroke-width="1" stroke-dasharray="3,2"/>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="25" cy="25" r="2" fill="#4FD1C5" opacity="0.3"/>
  <circle cx="455" cy="280" r="2" fill="#4FD1C5" opacity="0.3"/>
</svg>
